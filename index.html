<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10151a">
<meta name="description" content="Luna en Villa Pelón — RPG narrativo y educativo inspirado en San Patricio del Chañar.">
<title>Luna en Villa Pelón</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main id="app" aria-label="Luna en Villa Pelón">
<canvas id="game" aria-label="Mundo del juego"></canvas>
<section id="hud" class="hud">
<div class="brand"><strong>LUNA</strong><span>Villa Pelón</span></div>
<div class="hud-actions"><button data-action="journal" aria-label="Abrir diario">📖</button><button data-action="save" aria-label="Guardar partida">💾</button></div>
<div class="quest-card"><small>MISIÓN ACTIVA</small><strong id="quest-title">—</strong><span id="quest-objective">—</span></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</section>
<section id="dialog" class="dialog hidden" aria-live="polite"><div class="dialog-name" id="dialog-name">—</div><div class="dialog-text" id="dialog-text">—</div><button id="dialog-next">Continuar</button></section>
<section id="journal" class="panel hidden" aria-label="Diario">
<div class="panel-head"><h2>Diario de Luna</h2><button data-action="journal">×</button></div>
<div class="tabs"><button data-tab="missions">Misiones</button><button data-tab="knowledge">Conocimiento</button><button data-tab="memories">Memorias</button></div>
<div id="journal-content"></div>
</section>
<div id="touch-controls" aria-label="Controles táctiles">
<div class="dpad"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div>
<button class="action-btn" data-action="interact">ACTUAR</button>
</div>
<div id="desktop-help">Flechas / WASD · E o Espacio: interactuar · J: diario · G: guardar</div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
